name: release-please

# Держит release-PR по Conventional Commits из master: версия в package.json,
# CHANGELOG.md и тег vX.Y.Z после слияния. Настройки — release-please-config.json.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
