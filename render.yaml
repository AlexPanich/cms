# Демо-стенд на Render (Blueprint). Продакшен — docker-compose.prod.yml на своём сервере.
# Бесплатный план: сервис засыпает через 15 минут без запросов, загруженные файлы
# пропадают при каждом деплое, рестарте и засыпании, база удаляется через 30 дней
# (плюс 14 дней на продление). Подробно — в README, раздел «Демо на Render».
services:
  - type: web
    name: cms-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/render.Dockerfile
    branch: master
    # Деплой только после зелёного CI на этом коммите.
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cms-demo-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true

databases:
  - name: cms-demo-db
    plan: free
    region: frankfurt
    databaseName: cms
    user: cms
    postgresMajorVersion: "17"
